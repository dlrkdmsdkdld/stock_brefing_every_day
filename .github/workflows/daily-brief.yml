name: 데일리 브리핑

# 미국 정규장 마감(16:00 ET) 직후에 돌린다. 한국시간으로는 서머타임 때 05:00,
# 겨울에는 06:00이라 한 시간 움직이는데 cron은 UTC 고정이라 하나로는 못 맞춘다.
# 그래서 두 번 걸어 두고, 아래 check 잡이 "장이 닫혔고 오늘 아직 안 돌았을 때"만 통과시킨다.
#   20 20 UTC = 05:20 KST  (서머타임에 유효, 겨울에는 아직 장중이라 통과 못 함)
#   20 21 UTC = 06:20 KST  (겨울에 유효, 서머타임에는 이미 돌았으므로 통과 못 함)
# GitHub의 예약 실행은 혼잡할 때 수십 분 늦어질 수 있어 :00, :30은 피했다.
on:
  schedule:
    - cron: "20 20 * * *"
    - cron: "20 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - name: 실행 조건 확인
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          manual = os.environ.get("EVENT") == "workflow_dispatch"
          now_ny = datetime.now(ZoneInfo("America/New_York"))
          today_kst = datetime.now(ZoneInfo("Asia/Seoul")).date().isoformat()
          # 종가가 확정되는 시각(마감 16:00 + 여유 15분)을 넘겼는지
          closed = now_ny.time() >= time(16, 15)
          path = Path("prices.json")
          done = False
          if path.exists():
              done = json.loads(path.read_text(encoding="utf-8")).get(
                  "fetched_at", "")[:10] == today_kst
          proceed = manual or (closed and not done)
          print(f"proceed={'true' if proceed else 'false'}")
          print(f"뉴욕 {now_ny:%m-%d %H:%M} · 장 마감 {closed} · 오늘 이미 실행 {done} "
                f"· 수동 {manual} -> 진행 {proceed}", file=__import__("sys").stderr)
          PY
        env:
          EVENT: ${{ github.event_name }}

  brief:
    needs: check
    if: ${{ needs.check.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      # if 조건에서 읽으려면 잡 레벨 env로 올려야 한다. secrets 컨텍스트는 step의 if에서 못 쓴다.
      # 앞의 키가 한도에 걸리면 다음 키로 넘어간다. 없는 키는 그냥 건너뛴다.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
      OPENAI_API_KEY_3: ${{ secrets.OPENAI_API_KEY_3 }}
      OPENAI_API_KEY_4: ${{ secrets.OPENAI_API_KEY_4 }}
      OPENAI_API_KEY_5: ${{ secrets.OPENAI_API_KEY_5 }}
      OPENAI_API_KEY_6: ${{ secrets.OPENAI_API_KEY_6 }}
      # OpenAI 키를 모두 소진하면 넘어갈 마지막 예비(기본 설정은 Gemini 무료 티어).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 브리핑 웹페이지(GitHub Pages) 주소. 텔레그램 첫 메시지에 링크로 붙는다.
      BRIEF_URL: ${{ vars.BRIEF_URL }}
      # 저장소 변수 SKIP_SUMMARY를 1로 두면 요약 단계를 건너뛴다.
      # 무료 계정 토큰 한도를 아끼면서 가격·지표·특이점·발송만 돌릴 때 쓴다.
      SKIP_SUMMARY: ${{ vars.SKIP_SUMMARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 종가 수집
        # 교차검증 불일치 등으로 종료 코드 1이 나와도 뒤 단계는 계속 진행한다.
        continue-on-error: true
        run: python prices.py

      - name: 뉴스 수집
        continue-on-error: true
        run: python news.py

      - name: 기사 요약·호재/악재 판단
        if: ${{ (env.OPENAI_API_KEY != '' || env.OPENAI_API_KEY_2 != '' || env.OPENAI_API_KEY_3 != '' || env.OPENAI_API_KEY_4 != '' || env.OPENAI_API_KEY_5 != '' || env.OPENAI_API_KEY_6 != '' || env.GEMINI_API_KEY != '') && env.SKIP_SUMMARY != '1' }}
        continue-on-error: true
        run: python summarize.py

      - name: 오늘의 추천 종목
        if: ${{ (env.OPENAI_API_KEY != '' || env.OPENAI_API_KEY_2 != '' || env.OPENAI_API_KEY_3 != '' || env.OPENAI_API_KEY_4 != '' || env.OPENAI_API_KEY_5 != '' || env.OPENAI_API_KEY_6 != '' || env.GEMINI_API_KEY != '') && env.SKIP_SUMMARY != '1' }}
        continue-on-error: true
        run: python recommend.py

      - name: 추천 성적 추적
        continue-on-error: true
        run: python track.py

      - name: 브리핑 생성
        continue-on-error: true
        run: python brief.py

      - name: 텔레그램 전송
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        run: python notify.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json news.json verdicts.json recommendation.json history.json briefing.md briefing.html index.html
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "브리핑 $(date +%Y-%m-%d)"
          git push

      - name: 브리핑 파일 첨부
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: |
            briefing.html
            briefing.md
            news.json
            prices.json
          retention-days: 30
