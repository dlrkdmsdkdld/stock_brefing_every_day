name: 데일리 브리핑

# 매일 06:30 KST = 21:30 UTC 전날. 미국 정규장 마감(16:00 ET) 직후라 전날 미국 종가가 확정돼 있고,
# 국내장 개장(09:00 KST) 전이다. GitHub의 예약 실행은 혼잡할 때 수십 분 늦어질 수 있다.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      # if 조건에서 읽으려면 잡 레벨 env로 올려야 한다. secrets 컨텍스트는 step의 if에서 못 쓴다.
      # 앞의 키가 한도에 걸리면 다음 키로 넘어간다. 없는 키는 그냥 건너뛴다.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY_2: ${{ secrets.OPENAI_API_KEY_2 }}
      OPENAI_API_KEY_3: ${{ secrets.OPENAI_API_KEY_3 }}
      OPENAI_API_KEY_4: ${{ secrets.OPENAI_API_KEY_4 }}
      OPENAI_API_KEY_5: ${{ secrets.OPENAI_API_KEY_5 }}
      OPENAI_API_KEY_6: ${{ secrets.OPENAI_API_KEY_6 }}
      # OpenAI 키를 모두 소진하면 넘어갈 마지막 예비(기본 설정은 Gemini 무료 티어).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 브리핑 웹페이지(GitHub Pages) 주소. 텔레그램 첫 메시지에 링크로 붙는다.
      BRIEF_URL: ${{ vars.BRIEF_URL }}
      # 저장소 변수 SKIP_SUMMARY를 1로 두면 요약 단계를 건너뛴다.
      # 무료 계정 토큰 한도를 아끼면서 가격·지표·특이점·발송만 돌릴 때 쓴다.
      SKIP_SUMMARY: ${{ vars.SKIP_SUMMARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 종가 수집
        # 교차검증 불일치 등으로 종료 코드 1이 나와도 뒤 단계는 계속 진행한다.
        continue-on-error: true
        run: python prices.py

      - name: 뉴스 수집
        continue-on-error: true
        run: python news.py

      - name: 기사 요약·호재/악재 판단
        if: ${{ (env.OPENAI_API_KEY != '' || env.OPENAI_API_KEY_2 != '' || env.OPENAI_API_KEY_3 != '' || env.OPENAI_API_KEY_4 != '' || env.OPENAI_API_KEY_5 != '' || env.OPENAI_API_KEY_6 != '' || env.GEMINI_API_KEY != '') && env.SKIP_SUMMARY != '1' }}
        continue-on-error: true
        run: python summarize.py

      - name: 오늘의 추천 종목
        if: ${{ (env.OPENAI_API_KEY != '' || env.OPENAI_API_KEY_2 != '' || env.OPENAI_API_KEY_3 != '' || env.OPENAI_API_KEY_4 != '' || env.OPENAI_API_KEY_5 != '' || env.OPENAI_API_KEY_6 != '' || env.GEMINI_API_KEY != '') && env.SKIP_SUMMARY != '1' }}
        continue-on-error: true
        run: python recommend.py

      - name: 추천 성적 추적
        continue-on-error: true
        run: python track.py

      - name: 브리핑 생성
        continue-on-error: true
        run: python brief.py

      - name: 텔레그램 전송
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        run: python notify.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json news.json verdicts.json recommendation.json history.json briefing.md briefing.html index.html
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "브리핑 $(date +%Y-%m-%d)"
          git push

      - name: 브리핑 파일 첨부
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: |
            briefing.html
            briefing.md
            news.json
            prices.json
          retention-days: 30
